# Run bitsandbytes' own test suite on real consumer AMD GPUs.
#
# bitsandbytes ships ROCm builds in its PyPI wheels (since 0.49), but CI tests
# CUDA only (test-runner.yml takes cpu|cuda). This job installs a released
# wheel with ROCm torch on a Radeon 8060S (Strix Halo, gfx1151) and a Radeon AI
# PRO R9700 (gfx1201), checks that the ROCm build of the native library is the
# one loaded, and runs a deterministic sample of the release's own tests.
#
# Every run uploads summary-*.json (versions, device, pass/fail counts) so
# results compare across releases; other workflows call this one for a
# version matrix (workflow_call).
#
# Runners: AMD DevLab, a donated pool of ephemeral, single-use machines. One
# job per machine; nothing persists between jobs.
name: ROCm test (gfx1151, gfx1201)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bnb_version:
        description: bitsandbytes version from PyPI (empty = latest)
        default: ""
      torch_index_url:
        description: Index torch comes from
        default: https://download.pytorch.org/whl/rocm10.0
      tests_per_file:
        description: Test cases to run per test file (0 = all)
        default: "60"
      pytest_k:
        description: Optional pytest -k expression (e.g. to rerun one failing test in full)
        default: ""
  workflow_call:
    inputs:
      bnb_version: {type: string, default: ""}
      torch_spec: {type: string, default: "torch"}
      torch_index_url: {type: string, default: https://download.pytorch.org/whl/rocm10.0}
      tests_per_file: {type: string, default: "60"}
      label: {type: string, default: release}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.gpu }} (${{ matrix.gfx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: strix-halo
            gfx: gfx1151
          - gpu: radeon-r9700
            gfx: gfx1201
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ matrix.gpu }}"]
    timeout-minutes: 75
    env:
      BNB_VERSION: ${{ github.event.release.tag_name || inputs.bnb_version || '' }}
      TORCH_SPEC: ${{ inputs.torch_spec || 'torch' }}
      TORCH_INDEX_URL: ${{ inputs.torch_index_url || 'https://download.pytorch.org/whl/rocm10.0' }}
      PER_FILE: ${{ inputs.tests_per_file || '60' }}
      PYTEST_K: ${{ inputs.pytest_k || '' }}
      LABEL: ${{ inputs.label || 'release' }}
      TORCH_INDEX_MAP: ${{ vars.TORCH_INDEX_MAP }}
      BNB_TEST_DEVICE: cuda
      SAMPLER_DIR: ${{ github.workspace }}/../devlab-sampler
    steps:
      - name: Write the test sampler
        run: |
          # A pytest plugin that keeps a deterministic sample at collection time:
          # every pytest-xdist worker selects the same tests, and node ids never
          # pass through the shell.
          mkdir -p "$SAMPLER_DIR"
          cat > "$SAMPLER_DIR/devlab_sample.py" <<'PY'
          import os
          from collections import defaultdict


          def pytest_collection_modifyitems(config, items):
              per = int(os.environ.get("DEVLAB_PER") or 0)
              if per <= 0:
                  return
              by_file = os.environ.get("DEVLAB_GROUP", "function") == "file"
              groups = defaultdict(list)
              for item in items:
                  nodeid = item.nodeid
                  groups[nodeid.split("::")[0] if by_file else nodeid.split("[")[0]].append(item)
              keep = set()
              for members in groups.values():
                  step = max(1, len(members) // per)
                  keep.update(id(i) for i in members[::step][:per])
              config.hook.pytest_deselected(items=[i for i in items if id(i) not in keep])
              items[:] = [i for i in items if id(i) in keep]
          PY

      - name: Install torch and bitsandbytes
        id: install
        run: |
          set -euo pipefail
          python3 -m venv venv
          . venv/bin/activate
          pip install -q --upgrade pip
          spec="${TORCH_SPEC//\{gfx\}/${{ matrix.gfx }}}"     # torch[device-{gfx}] for TheRock
          INDEX="$TORCH_INDEX_URL"
          # A runner pool with a package mirror maps public indexes to it with the
          # TORCH_INDEX_MAP repository variable (JSON: index URL -> mirror URL).
          # Unset, the index is used as given.
          EXTRA=()
          if [ -n "${TORCH_INDEX_MAP:-}" ]; then
            idx_in="$INDEX"
            # A value is a mirror URL, or a list [index, extra index, ...] when the
            # mirror serves the index's packages from more than one repository.
            idx=$(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); u=sys.argv[2]; v=m.get(u.rstrip("/")+"/", m.get(u.rstrip("/"), u)); print("\n".join([v] if isinstance(v, str) else v))' "$TORCH_INDEX_MAP" "$INDEX")
            mapfile -t idx <<<"$idx"
            INDEX="${idx[0]}"
            for e in "${idx[@]:1}"; do EXTRA+=(--extra-index-url "$e"); done
            [ "$INDEX" = "$idx_in" ] && [ ${#idx[@]} -eq 1 ] || echo "torch index mapped: $idx_in -> $INDEX${EXTRA:+ (extra: ${idx[*]:1})}"
          fi
          echo "torch: $spec from $INDEX"
          # PIP_CONFIG_FILE=/dev/null: a runner's pip.conf may add PyPI as an
          # extra index, and PyPI's newer CUDA torch then outranks the ROCm build.
          PIP_CONFIG_FILE=/dev/null pip install -q "$spec" --index-url "$INDEX" "${EXTRA[@]}"
          # Pin the torch stack for every later pip call: a package that depends on
          # torch can otherwise replace the ROCm build with a CUDA wheel from PyPI,
          # and the tests run on the CPU.
          pip freeze | grep -iE '^(torch|torchvision|torchaudio|triton|pytorch-triton-rocm|rocm[a-z0-9_-]*)==' \
            > "$RUNNER_TEMP/torch-pin.txt"
          cat "$RUNNER_TEMP/torch-pin.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/torch-pin.txt"
          echo "PIP_CONSTRAINT=$PIP_CONSTRAINT" >> "$GITHUB_ENV"
          # The release's own [test] extra pins its test dependencies (e.g. transformers<5).
          pip install -q "bitsandbytes[test]${BNB_VERSION:+==$BNB_VERSION}" pytest-timeout
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, torch, bitsandbytes as bnb
          from bitsandbytes.cextension import lib
          assert torch.version.hip, f"not a ROCm build of torch: {torch.__version__}"
          p = torch.cuda.get_device_properties(0)
          libname = getattr(getattr(lib, "_lib", None), "_name", "") or ""
          info = {"torch": torch.__version__, "hip": torch.version.hip, "device": p.name,
                  "arch": p.gcnArchName, "bitsandbytes": bnb.__version__, "native_lib": libname}
          json.dump(info, open("env.json", "w"))
          import sys; print(info, file=sys.stderr)
          # A CPU or CUDA build would make this job test something else.
          assert "rocm" in libname, f"ROCm native library not loaded: {libname!r}"
          assert "${{ matrix.gfx }}" in p.gcnArchName, f"expected ${{ matrix.gfx }}, got {p.gcnArchName}"
          print(f"version={bnb.__version__}")
          PY

      - name: Fetch the release's tests
        run: |
          set -euo pipefail
          git init -q src && cd src
          git remote add origin https://github.com/bitsandbytes-foundation/bitsandbytes.git
          git fetch -q --depth 1 origin "refs/tags/${{ steps.install.outputs.version }}"
          # pyproject.toml carries the pytest config: addopts deselects the slow,
          # benchmark and deprecated tests, as upstream CI does.
          git checkout -q FETCH_HEAD -- tests pyproject.toml
          echo "tests from ${{ steps.install.outputs.version }}"

      - name: Tests (deterministic sample)
        working-directory: src
        run: |
          set -euo pipefail
          . ../venv/bin/activate
          # Serial: the cases share one GPU and several allocate most of it.
          k=()
          [ -z "$PYTEST_K" ] || k=(-k "$PYTEST_K")
          PYTHONPATH="$SAMPLER_DIR" DEVLAB_PER="$PER_FILE" DEVLAB_GROUP=file \
            python -m pytest tests -p devlab_sample -q -rfE -p no:cacheprovider --timeout=900 \
            --junitxml=../junit.xml "${k[@]}"

      - name: Write the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime, xml.etree.ElementTree as ET
          def load(p):
              try:
                  return json.load(open(p))
              except Exception:
                  return None
          tests = None
          if os.path.exists("junit.xml"):
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              n = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
              tests = {"ran": n["tests"], "failed": n["failures"], "errors": n["errors"],
                       "skipped": n["skipped"],
                       "passed": n["tests"] - n["failures"] - n["errors"] - n["skipped"],
                       "seconds": round(float(s.get("time", 0)), 1)}
          env = load("env.json") or {}
          summary = {
              "schema": 1, "project": "bitsandbytes", "label": os.environ["LABEL"],
              "release": env.get("bitsandbytes", os.environ.get("BNB_VERSION", "")),
              "combo": f"torch{(env.get('torch') or '?')}",
              "torch_spec": os.environ.get("TORCH_SPEC", ""), "gpu": "${{ matrix.gpu }}",
              "gfx": "${{ matrix.gfx }}", "env": env or None, "smoke": None, "tests": tests,
              "job_status": "${{ job.status }}",
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          json.dump(summary, open("summary.json", "w"), indent=1)
          print(json.dumps(summary, indent=1))
          PY

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-summary-${{ inputs.label || 'release' }}-${{ strategy.job-index }}-${{ matrix.gpu }}-${{ github.run_attempt }}
          path: summary.json
          retention-days: 90
